name: Fetch new stories

# Every hour: check The Hacker News feed and queue new stories in data/queue/.
# The scheduled Claude task writes the Thai pages for queued stories every 6 hours.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/news_writer.py fetch
      - name: Commit queue
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Queue new stories $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
