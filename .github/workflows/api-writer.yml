name: "Optional: write news with an API key"

# Only needed if you'd rather use an Anthropic API key than the scheduled Claude task.
# To run it on a schedule, uncomment the two lines below and add the ANTHROPIC_API_KEY secret.
on:
  # schedule:
  #   - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: "Agent 1: write Thai articles for new stories"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/news_writer.py api

      - name: Commit new pages
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "News update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      - name: "Agent 2: Facebook drafts or posts"
        env:
          FB_MODE: ${{ vars.FB_MODE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/fb_poster.py queue

      - name: Commit Facebook status
        if: always()
        run: |
          git add -A data
          git diff --cached --quiet || git commit -m "Facebook status update"
          git pull --rebase
          git push
